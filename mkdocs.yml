site_name: MorphLab
site_description: Experimental Mechatronics Research Platform
repo_name: MahdiHooshmand/MorphLab
repo_url: https://github.com/MahdiHooshmand/MorphLab

theme:
  name: material

nav:
  - Home: index.md
  - RFC:
      - RFC-001: rfcs/RFC-001-Platform-Vision.md
      - RFC-002: rfcs/RFC-002-Terminology.md
      - RFC-003: rfcs/RFC-003-Domain-Model.md
      - RFC-004: rfcs/RFC-004-System-Context.md
      - RFC-005: rfcs/RFC-005-Design-Principles.md
  - ADR:
      - ADR-001: adrs/ADR-001-JSON-Messaging-Protocol-and-Transport-Strategy.md
      - ADR-002: adrs/ADR-002-Execution-Frequency-and-Missing-Data-Strategy.md
      - ADR-003: adrs/ADR-003-Multi-Source-Time-Synchronization.md
      - ADR-004: adrs/ADR-004-Asset-Repository-Structure-and-Code-Standards.md
      - ADR-005: adrs/ADR-005-Extensible-Safety-Framework.md
  - Standards: standards/
  - Specifications: specifications/

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.emoji
